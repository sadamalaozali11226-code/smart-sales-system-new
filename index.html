<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .language-btn {
      background: white;
      color: #1f2937;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #666;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 28px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .customer-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .customer-form textarea {
      width: 100%;
      min-height: 45px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .customer-form .full-width {
      grid-column: 1 / -1;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .customer-add-btn {
      background: #7c3aed;
      color: white;
    }

    .sale-btn {
      background: #16a34a;
      color: white;
    }

    .danger-btn {
      background: #dc2626;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #f8fafc;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .form {
        grid-template-columns: 1fr;
      }

      .customer-form {
        grid-template-columns: 1fr;
      }

      .customer-form .full-width {
        grid-column: auto;
      }

      header {
        flex-direction: column;
        text-align: center;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 8px 4px;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      body {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1 id="title">نظام المبيعات الذكي</h1>

      <button
        class="language-btn"
        onclick="toggleLanguage()"
        id="languageBtn"
      >
        English
      </button>
    </header>

    <div class="cards">

      <div class="card">
        <h3 id="productsLabel">المنتجات</h3>
        <strong id="productsCount">0</strong>
      </div>

      <div class="card">
        <h3 id="stockLabel">إجمالي المخزون</h3>
        <strong id="stockCount">0</strong>
      </div>

      <div class="card">
        <h3 id="salesLabel">المبيعات</h3>
        <strong id="salesTotal">0.00</strong>
      </div>

      <div class="card">
        <h3 id="customersLabel">العملاء</h3>
        <strong id="customersCount">0</strong>
      </div>

    </div>

    <div class="section">

      <h2 id="productsTitle">إدارة المنتجات</h2>

      <div class="form">

        <input
          type="text"
          id="productName"
          placeholder="اسم المنتج"
        >

        <input
          type="number"
          id="productPrice"
          placeholder="السعر"
          min="0"
        >

        <input
          type="number"
          id="productQuantity"
          placeholder="الكمية"
          min="0"
        >

        <button
          class="add-btn"
          onclick="addProduct()"
          id="addButton"
        >
          إضافة
        </button>

      </div>

      <div id="message" class="message"></div>

      <table>

        <thead>
          <tr>
            <th id="nameHeader">المنتج</th>
            <th id="priceHeader">السعر</th>
            <th id="quantityHeader">الكمية</th>
            <th id="actionHeader">الإجراء</th>
          </tr>
        </thead>

        <tbody id="productsTable"></tbody>

      </table>

      <div class="empty" id="emptyMessage">
        لا توجد منتجات حاليًا
      </div>

    </div>

    <div class="section">

      <h2 id="customersTitle">إدارة العملاء</h2>

      <div class="customer-form">

        <input
          type="text"
          id="customerName"
          placeholder="اسم العميل"
        >

        <input
          type="text"
          id="customerPhone"
          placeholder="رقم الهاتف"
        >

        <input
          type="text"
          id="customerAddress"
          class="full-width"
          placeholder="العنوان"
        >

        <textarea
          id="customerNotes"
          class="full-width"
          placeholder="ملاحظات"
        ></textarea>

        <button
          class="customer-add-btn"
          onclick="addCustomer()"
          id="customerAddButton"
        >
          إضافة عميل
        </button>

      </div>

      <table>

        <thead>
          <tr>
            <th id="customerNameHeader">الاسم</th>
            <th id="customerPhoneHeader">الهاتف</th>
            <th id="customerAddressHeader">العنوان</th>
            <th id="customerNotesHeader">الملاحظات</th>
          </tr>
        </thead>

        <tbody id="customersTable"></tbody>

      </table>

      <div class="empty" id="customersEmptyMessage">
        لا يوجد عملاء حاليًا
      </div>

    </div>

  </div>

  <script>
    let currentLanguage = "ar";
    let products = [];
    let customers = [];

    const translations = {

      ar: {
        title: "نظام المبيعات الذكي",
        language: "English",
        products: "المنتجات",
        stock: "إجمالي المخزون",
        sales: "المبيعات",
        customers: "العملاء",
        productsTitle: "إدارة المنتجات",
        customersTitle: "إدارة العملاء",
        namePlaceholder: "اسم المنتج",
        pricePlaceholder: "السعر",
        quantityPlaceholder: "الكمية",
        customerNamePlaceholder: "اسم العميل",
        customerPhonePlaceholder: "رقم الهاتف",
        customerAddressPlaceholder: "العنوان",
        customerNotesPlaceholder: "ملاحظات",
        add: "إضافة",
        addCustomer: "إضافة عميل",
        name: "المنتج",
        price: "السعر",
        quantity: "الكمية",
        action: "الإجراء",
        customerName: "الاسم",
        customerPhone: "الهاتف",
        customerAddress: "العنوان",
        customerNotes: "الملاحظات",
        sell: "بيع",
        delete: "حذف",
        empty: "لا توجد منتجات حاليًا",
        customersEmpty: "لا يوجد عملاء حاليًا",
        added: "تمت إضافة المنتج بنجاح",
        customerAdded: "تمت إضافة العميل بنجاح",
        sold: "تم تسجيل البيع",
        deleted: "تم حذف المنتج",
        invalid: "يرجى إدخال بيانات صحيحة",
        customerNameRequired: "يرجى إدخال اسم العميل",
        productsLoadError: "حدث خطأ أثناء تحميل المنتجات",
        customersLoadError: "حدث خطأ أثناء تحميل العملاء",
        connectionError: "حدث خطأ في الاتصال"
      },

      en: {
        title: "Smart Sales System",
        language: "العربية",
        products: "Products",
        stock: "Total Stock",
        sales: "Sales",
        customers: "Customers",
        productsTitle: "Product Management",
        customersTitle: "Customer Management",
        namePlaceholder: "Product name",
        pricePlaceholder: "Price",
        quantityPlaceholder: "Quantity",
        customerNamePlaceholder: "Customer name",
        customerPhonePlaceholder: "Phone number",
        customerAddressPlaceholder: "Address",
        customerNotesPlaceholder: "Notes",
        add: "Add",
        addCustomer: "Add Customer",
        name: "Product",
        price: "Price",
        quantity: "Quantity",
        action: "Action",
        customerName: "Name",
        customerPhone: "Phone",
        customerAddress: "Address",
        customerNotes: "Notes",
        sell: "Sell",
        delete: "Delete",
        empty: "No products currently",
        customersEmpty: "No customers currently",
        added: "Product added successfully",
        customerAdded: "Customer added successfully",
        sold: "Sale recorded",
        deleted: "Product deleted",
        invalid: "Please enter valid data",
        customerNameRequired: "Please enter customer name",
        productsLoadError: "Error loading products",
        customersLoadError: "Error loading customers",
        connectionError: "Connection error"
      }

    };

    function toggleLanguage() {

      currentLanguage =
        currentLanguage === "ar"
          ? "en"
          : "ar";

      const t =
        translations[currentLanguage];

      document.documentElement.lang =
        currentLanguage;

      document.documentElement.dir =
        currentLanguage === "ar"
          ? "rtl"
          : "ltr";

      document.getElementById("title").textContent =
        t.title;

      document.getElementById("languageBtn").textContent =
        t.language;

      document.getElementById("productsLabel").textContent =
        t.products;

      document.getElementById("stockLabel").textContent =
        t.stock;

      document.getElementById("salesLabel").textContent =
        t.sales;

      document.getElementById("customersLabel").textContent =
        t.customers;

      document.getElementById("productsTitle").textContent =
        t.productsTitle;

      document.getElementById("customersTitle").textContent =
        t.customersTitle;

      document.getElementById("productName").placeholder =
        t.namePlaceholder;

      document.getElementById("productPrice").placeholder =
        t.pricePlaceholder;

      document.getElementById("productQuantity").placeholder =
        t.quantityPlaceholder;

      document.getElementById("customerName").placeholder =
        t.customerNamePlaceholder;

      document.getElementById("customerPhone").placeholder =
        t.customerPhonePlaceholder;

      document.getElementById("customerAddress").placeholder =
        t.customerAddressPlaceholder;

      document.getElementById("customerNotes").placeholder =
        t.customerNotesPlaceholder;

      document.getElementById("addButton").textContent =
        t.add;

      document.getElementById("customerAddButton").textContent =
        t.addCustomer;

      document.getElementById("nameHeader").textContent =
        t.name;

      document.getElementById("priceHeader").textContent =
        t.price;

      document.getElementById("quantityHeader").textContent =
        t.quantity;

      document.getElementById("actionHeader").textContent =
        t.action;

      document.getElementById("customerNameHeader").textContent =
        t.customerName;

      document.getElementById("customerPhoneHeader").textContent =
        t.customerPhone;

      document.getElementById("customerAddressHeader").textContent =
        t.customerAddress;

      document.getElementById("customerNotesHeader").textContent =
        t.customerNotes;

      document.getElementById("emptyMessage").textContent =
        t.empty;

      document.getElementById("customersEmptyMessage").textContent =
        t.customersEmpty;

      renderProducts();
      renderCustomers();
    }

    async function loadProducts() {

      try {

        const response =
          await fetch("/api/products");

        if (!response.ok) {
          throw new Error("Failed to load products");
        }

        products =
          await response.json();

        renderProducts();

      } catch (error) {

        console.error(error);

        showMessage(
          translations[currentLanguage]
            .productsLoadError,
          true
        );
      }
    }

    async function loadSales() {

      try {

        const response =
          await fetch("/api/sales");

        if (!response.ok) {
          throw new Error("Failed to load sales");
        }

        const data =
          await response.json();

        document.getElementById(
          "salesTotal"
        ).textContent =
          Number(data.total || 0).toFixed(2);

      } catch (error) {

        console.error(error);

        document.getElementById(
          "salesTotal"
        ).textContent =
          "0.00";
      }
    }

    async function loadCustomers() {

      try {

        const response =
          await fetch("/api/customers");

        if (!response.ok) {
          throw new Error("Failed to load customers");
        }

        customers =
          await response.json();

        renderCustomers();

      } catch (error) {

        console.error(error);

        customers = [];

        renderCustomers();

        showMessage(
          translations[currentLanguage]
            .customersLoadError,
          true
        );
      }
    }

    async function addProduct() {

      const name =
        document
          .getElementById("productName")
          .value
          .trim();

      const price =
        document
          .getElementById("productPrice")
          .value;

      const quantity =
        document
          .getElementById("productQuantity")
          .value;

      const t =
        translations[currentLanguage];

      if (
        !name ||
        price === "" ||
        quantity === ""
      ) {

        showMessage(
          t.invalid,
          true
        );

        return;
      }

      try {

        const response =
          await fetch(
            "/api/products",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                name,
                price,
                quantity
              })
            }
          );

        if (!response.ok) {

          showMessage(
            t.invalid,
            true
          );

          return;
        }

        document
          .getElementById("productName")
          .value = "";

        document
          .getElementById("productPrice")
          .value = "";

        document
          .getElementById("productQuantity")
          .value = "";

        showMessage(t.added);

        await loadProducts();

      } catch (error) {

        console.error(error);

        showMessage(
          t.connectionError,
          true
        );
      }
    }

    async function addCustomer() {

      const name =
        document
          .getElementById("customerName")
          .value
          .trim();

      const phone =
        document
          .getElementById("customerPhone")
          .value
          .trim();

      const address =
        document
          .getElementById("customerAddress")
          .value
          .trim();

      const notes =
        document
          .getElementById("customerNotes")
          .value
          .trim();

      const t =
        translations[currentLanguage];

      if (!name) {

        showMessage(
          t.customerNameRequired,
          true
        );

        return;
      }

      try {

        const response =
          await fetch(
            "/api/customers",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                name,
                phone,
                address,
                notes
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Failed to add customer"
          );
        }

        document
          .getElementById("customerName")
          .value = "";

        document
          .getElementById("customerPhone")
          .value = "";

        document
          .getElementById("customerAddress")
          .value = "";

        document
          .getElementById("customerNotes")
          .value = "";

        showMessage(
          t.customerAdded
        );

        await loadCustomers();

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          t.connectionError,
          true
        );
      }
    }

    function renderProducts() {

      const table =
        document.getElementById(
          "productsTable"
        );

      const empty =
        document.getElementById(
          "emptyMessage"
        );

      table.innerHTML = "";

      const t =
        translations[currentLanguage];

      if (products.length === 0) {

        empty.style.display =
          "block";

      } else {

        empty.style.display =
          "none";
      }

      let totalStock = 0;

      products.forEach(product => {

        totalStock +=
          Number(product.quantity);

        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td>${escapeHtml(product.name)}</td>

          <td>${Number(product.price).toFixed(2)}</td>

          <td>${product.quantity}</td>

          <td>

            <button
              class="sale-btn"
              onclick="sellProduct(${product.id})"
            >
              ${t.sell}
            </button>

            <button
              class="danger-btn"
              onclick="deleteProduct(${product.id})"
            >
              ${t.delete}
            </button>

          </td>
        `;

        table.appendChild(row);
      });

      document.getElementById(
        "productsCount"
      ).textContent =
        products.length;

      document.getElementById(
        "stockCount"
      ).textContent =
        totalStock;
    }

    function renderCustomers() {

      const table =
        document.getElementById(
          "customersTable"
        );

      const empty =
        document.getElementById(
          "customersEmptyMessage"
        );

      table.innerHTML = "";

      if (customers.length === 0) {

        empty.style.display =
          "block";

      } else {

        empty.style.display =
          "none";
      }

      customers.forEach(customer => {

        const row =
          document.createElement("tr");

        row.innerHTML = `
          <td>${escapeHtml(customer.name || "")}</td>

          <td>${escapeHtml(customer.phone || "")}</td>

          <td>${escapeHtml(customer.address || "")}</td>

          <td>${escapeHtml(customer.notes || "")}</td>
        `;

        table.appendChild(row);
      });

      document.getElementById(
        "customersCount"
      ).textContent =
        customers.length;
    }

    async function sellProduct(id) {

      const product =
        products.find(
          p => Number(p.id) === Number(id)
        );

      if (!product) {
        return;
      }

      if (
        Number(product.quantity) <= 0
      ) {

        showMessage(
          currentLanguage === "ar"
            ? "المنتج غير متوفر في المخزون"
            : "Product is out of stock",
          true
        );

        return;
      }

      try {

        const response =
          await fetch(
            "/api/sell",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body: JSON.stringify({
                id: Number(id)
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Failed to record sale"
          );
        }

        if (data.product) {

          const index =
            products.findIndex(
              p =>
                Number(p.id) ===
                Number(id)
            );

          if (index !== -1) {

            products[index] =
              data.product;
          }

        }

        await loadSales();

        renderProducts();

        showMessage(
          translations[currentLanguage]
            .sold
        );

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          (
            currentLanguage === "ar"
              ? "حدث خطأ أثناء تسجيل البيع"
              : "Error recording sale"
          ),
          true
        );
      }
    }

    async function deleteProduct(id) {

      const product =
        products.find(
          p =>
            Number(p.id) ===
            Number(id)
        );

      if (!product) {
        return;
      }

      const confirmed =
        confirm(
          currentLanguage === "ar"
            ? `هل أنت متأكد من حذف المنتج "${product.name}"؟`
            : `Are you sure you want to delete "${product.name}"?`
        );

      if (!confirmed) {
        return;
      }

      try {

        const response =
          await fetch(
            "/api/delete-product?id=" + id,
            {
              method: "DELETE"
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Failed to delete product"
          );
        }

        products =
          products.filter(
            product =>
              Number(product.id) !==
              Number(id)
          );

        renderProducts();

        showMessage(
          translations[currentLanguage]
            .deleted
        );

      } catch (error) {

        console.error(error);

        showMessage(
          currentLanguage === "ar"
            ? "حدث خطأ أثناء حذف المنتج"
            : "Error deleting product",
          true
        );
      }
    }

    function showMessage(
      message,
      isError = false
    ) {

      const element =
        document.getElementById(
          "message"
        );

      element.textContent =
        message;

      element.className =
        "message " +
        (
          isError
            ? "error"
            : "success"
        );

      element.style.display =
        "block";

      setTimeout(() => {

        element.style.display =
          "none";

      }, 2500);
    }

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;
    }

    async function initializeApp() {

      await Promise.all([
        loadProducts(),
        loadSales(),
        loadCustomers()
      ]);

    }

    initializeApp();

  </script>

</body>
</html>
