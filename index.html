<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .language-btn {
      background: white;
      color: #1f2937;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #666;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 28px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .sale-btn {
      background: #16a34a;
      color: white;
    }

    .danger-btn {
      background: #dc2626;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #f8fafc;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .form {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        text-align: center;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 8px 4px;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      body {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1 id="title">نظام المبيعات الذكي</h1>
    <button class="language-btn" onclick="toggleLanguage()" id="languageBtn">
      English
    </button>
  </header>

  <div class="cards">

    <div class="card">
      <h3 id="productsLabel">المنتجات</h3>
      <strong id="productsCount">0</strong>
    </div>

    <div class="card">
      <h3 id="stockLabel">إجمالي المخزون</h3>
      <strong id="stockCount">0</strong>
    </div>

    <div class="card">
      <h3 id="salesLabel">المبيعات</h3>
      <strong id="salesTotal">0</strong>
    </div>

    <div class="card">
      <h3 id="customersLabel">العملاء</h3>
      <strong id="customersCount">0</strong>
    </div>

  </div>

  <div class="section">

    <h2 id="productsTitle">إدارة المنتجات</h2>

    <div class="form">

      <input
        type="text"
        id="productName"
        placeholder="اسم المنتج"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="السعر"
        min="0"
      >

      <input
        type="number"
        id="productQuantity"
        placeholder="الكمية"
        min="0"
      >

      <button class="add-btn" onclick="addProduct()" id="addButton">
        إضافة
      </button>

    </div>

    <div id="message" class="message"></div>

    <table>

      <thead>
        <tr>
          <th id="nameHeader">المنتج</th>
          <th id="priceHeader">السعر</th>
          <th id="quantityHeader">الكمية</th>
          <th id="actionHeader">الإجراء</th>
        </tr>
      </thead>

      <tbody id="productsTable">
      </tbody>

    </table>

    <div class="empty" id="emptyMessage">
      لا توجد منتجات حاليًا
    </div>

  </div>

</div>

<script>

let currentLanguage = "ar";
let products = [];

const translations = {

  ar: {
    title: "نظام المبيعات الذكي",
    language: "English",
    products: "المنتجات",
    stock: "إجمالي المخزون",
    sales: "المبيعات",
    customers: "العملاء",
    productsTitle: "إدارة المنتجات",
    namePlaceholder: "اسم المنتج",
    pricePlaceholder: "السعر",
    quantityPlaceholder: "الكمية",
    add: "إضافة",
    name: "المنتج",
    price: "السعر",
    quantity: "الكمية",
    action: "الإجراء",
    sell: "بيع",
    delete: "حذف",
    empty: "لا توجد منتجات حاليًا",
    added: "تمت إضافة المنتج بنجاح",
    sold: "تم تسجيل البيع",
    deleted: "تم حذف المنتج",
    invalid: "يرجى إدخال بيانات صحيحة"
  },

  en: {
    title: "Smart Sales System",
    language: "العربية",
    products: "Products",
    stock: "Total Stock",
    sales: "Sales",
    customers: "Customers",
    productsTitle: "Product Management",
    namePlaceholder: "Product name",
    pricePlaceholder: "Price",
    quantityPlaceholder: "Quantity",
    add: "Add",
    name: "Product",
    price: "Price",
    quantity: "Quantity",
    action: "Action",
    sell: "Sell",
    delete: "Delete",
    empty: "No products currently",
    added: "Product added successfully",
    sold: "Sale recorded",
    deleted: "Product deleted",
    invalid: "Please enter valid data"
  }

};

function toggleLanguage() {

  currentLanguage = currentLanguage === "ar" ? "en" : "ar";

  const t = translations[currentLanguage];

  document.documentElement.lang = currentLanguage;
  document.documentElement.dir = currentLanguage === "ar" ? "rtl" : "ltr";

  document.getElementById("title").textContent = t.title;
  document.getElementById("languageBtn").textContent = t.language;

  document.getElementById("productsLabel").textContent = t.products;
  document.getElementById("stockLabel").textContent = t.stock;
  document.getElementById("salesLabel").textContent = t.sales;
  document.getElementById("customersLabel").textContent = t.customers;

  document.getElementById("productsTitle").textContent = t.productsTitle;

  document.getElementById("productName").placeholder = t.namePlaceholder;
  document.getElementById("productPrice").placeholder = t.pricePlaceholder;
  document.getElementById("productQuantity").placeholder = t.quantityPlaceholder;

  document.getElementById("addButton").textContent = t.add;

  document.getElementById("nameHeader").textContent = t.name;
  document.getElementById("priceHeader").textContent = t.price;
  document.getElementById("quantityHeader").textContent = t.quantity;
  document.getElementById("actionHeader").textContent = t.action;

  renderProducts();
}

async function loadProducts() {

  try {

    const response = await fetch("/api/products");

    products = await response.json();

    renderProducts();

  } catch (error) {

    console.error(error);

  }

}

async function addProduct() {

  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value;
  const quantity = document.getElementById("productQuantity").value;

  const t = translations[currentLanguage];

  if (!name || price === "" || quantity === "") {

    showMessage(t.invalid, true);

    return;
  }

  try {

    const response = await fetch("/api/products", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        name,
        price,
        quantity
      })

    });

    if (!response.ok) {

      showMessage(t.invalid, true);

      return;

    }

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productQuantity").value = "";

    showMessage(t.added);

    await loadProducts();

  } catch (error) {

    showMessage("Connection error", true);

  }

}

function renderProducts() {

  const table = document.getElementById("productsTable");
  const empty = document.getElementById("emptyMessage");

  table.innerHTML = "";

  const t = translations[currentLanguage];

  if (products.length === 0) {

    empty.style.display = "block";

  } else {

    empty.style.display = "none";

  }

  let totalStock = 0;

  products.forEach(product => {

    totalStock += Number(product.quantity);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHtml(product.name)}</td>
      <td>${Number(product.price).toFixed(2)}</td>
      <td>${product.quantity}</td>
      <td>
        <button
          class="sale-btn"
          onclick="sellProduct(${product.id})">
          ${t.sell}
        </button>

        <button
          class="danger-btn"
          onclick="deleteProduct(${product.id})">
          ${t.delete}
        </button>
      </td>
    `;

    table.appendChild(row);

  });

  document.getElementById("productsCount").textContent = products.length;
  document.getElementById("stockCount").textContent = totalStock;
}

function sellProduct(id) {

  const product = products.find(p => p.id === id);

  if (!product) return;

  if (Number(product.quantity) <= 0) {

    showMessage(
      currentLanguage === "ar"
        ? "المنتج غير متوفر في المخزون"
        : "Product is out of stock",
      true
    );

    return;
  }

  product.quantity = Number(product.quantity) - 1;

  document.getElementById("salesTotal").textContent =
    Number(document.getElementById("salesTotal").textContent) + Number(product.price);

  renderProducts();

  showMessage(translations[currentLanguage].sold);

}

function deleteProduct(id) {

  products = products.filter(product => product.id !== id);

  renderProducts();

  showMessage(translations[currentLanguage].deleted);

}

function showMessage(message, isError = false) {

  const element = document.getElementById("message");

  element.textContent = message;

  element.className =
    "message " + (isError ? "error" : "success");

  element.style.display = "block";

  setTimeout(() => {

    element.style.display = "none";

  }, 2500);

}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

loadProducts();

</script>

</body>
</html>
