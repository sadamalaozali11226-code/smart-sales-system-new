<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات الذكي</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: white;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 22px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .lang {
      background: white;
      color: #111827;
    }
    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 16px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 25px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .card h3 {
      margin-top: 0;
      color: #6b7280;
      font-size: 15px;
    }
    .number {
      font-size: 28px;
      font-weight: bold;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .panel h2 { margin-top: 0; }
    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .add {
      background: #2563eb;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: right;
    }
    th { background: #f9fafb; }

    @media (max-width: 700px) {
      form { grid-template-columns: 1fr; }
      header { gap: 10px; }
      header h1 { font-size: 17px; }
    }
  </style>
</head>

<body>

<header>
  <h1 id="title">نظام المبيعات الذكي</h1>
  <button class="lang" onclick="toggleLanguage()" id="langBtn">English</button>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3 id="productsTitle">المنتجات</h3>
      <div class="number" id="productsCount">0</div>
    </div>

    <div class="card">
      <h3 id="stockTitle">إجمالي المخزون</h3>
      <div class="number" id="stockCount">0</div>
    </div>

    <div class="card">
      <h3 id="salesTitle">المبيعات</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3 id="customersTitle">العملاء</h3>
      <div class="number">0</div>
    </div>
  </div>

  <div class="panel">
    <h2 id="manageTitle">إدارة المنتجات</h2>

    <form id="productForm">
      <input id="name" type="text" placeholder="اسم المنتج" required>
      <input id="price" type="number" step="0.01" placeholder="السعر" required>
      <input id="quantity" type="number" placeholder="الكمية" required>
      <button class="add" type="submit" id="addBtn">إضافة</button>
    </form>

    <table>
      <thead>
        <tr>
          <th id="nameHead">المنتج</th>
          <th id="priceHead">السعر</th>
          <th id="quantityHead">الكمية</th>
        </tr>
      </thead>
      <tbody id="productsTable"></tbody>
    </table>
  </div>

</div>

<script>
  let arabic = true;

  async function loadProducts() {
    try {
      const response = await fetch("/api/products");
      const products = await response.json();

      document.getElementById("productsCount").textContent = products.length;

      let stock = 0;
      products.forEach(p => stock += Number(p.quantity) || 0);
      document.getElementById("stockCount").textContent = stock;

      const table = document.getElementById("productsTable");
      table.innerHTML = "";

      products.forEach(product => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${product.name}</td>
          <td>${product.price}</td>
          <td>${product.quantity}</td>
        `;
        table.appendChild(row);
      });
    } catch (error) {
      console.error(error);
    }
  }

  document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const product = {
      name: document.getElementById("name").value,
      price: document.getElementById("price").value,
      quantity: document.getElementById("quantity").value
    };

    await fetch("/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(product)
    });

    this.reset();
    loadProducts();
  });

  function toggleLanguage() {
    arabic = !arabic;

    document.documentElement.lang = arabic ? "ar" : "en";
    document.documentElement.dir = arabic ? "rtl" : "ltr";

    document.getElementById("title").textContent =
      arabic ? "نظام المبيعات الذكي" : "Smart Sales System";

    document.getElementById("langBtn").textContent =
      arabic ? "English" : "العربية";

    document.getElementById("productsTitle").textContent =
      arabic ? "المنتجات" : "Products";

    document.getElementById("stockTitle").textContent =
      arabic ? "إجمالي المخزون" : "Total Stock";

    document.getElementById("salesTitle").textContent =
      arabic ? "المبيعات" : "Sales";

    document.getElementById("customersTitle").textContent =
      arabic ? "العملاء" : "Customers";

    document.getElementById("manageTitle").textContent =
      arabic ? "إدارة المنتجات" : "Product Management";

    document.getElementById("name").placeholder =
      arabic ? "اسم المنتج" : "Product Name";

    document.getElementById("price").placeholder =
      arabic ? "السعر" : "Price";

    document.getElementById("quantity").placeholder =
      arabic ? "الكمية" : "Quantity";

    document.getElementById("addBtn").textContent =
      arabic ? "إضافة" : "Add";

    document.getElementById("nameHead").textContent =
      arabic ? "المنتج" : "Product";

    document.getElementById("priceHead").textContent =
      arabic ? "السعر" : "Price";

    document.getElementById("quantityHead").textContent =
      arabic ? "الكمية" : "Quantity";
  }

  loadProducts();
</script>

</body>
</html>
