<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 15px;
    }

    .language-btn {
      background: white;
      color: #1f2937;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #666;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 28px;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .sale-btn {
      background: #16a34a;
      color: white;
    }

    .danger-btn {
      background: #dc2626;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #f8fafc;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .form {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        text-align: center;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 8px 4px;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      body {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1 id="title">نظام المبيعات الذكي</h1>
    <button class="language-btn" onclick="toggleLanguage()" id="languageBtn">
      English
    </button>
  </header>

  <div class="cards">

    <div class="card">
      <h3 id="productsLabel">المنتجات</h3>
      <strong id="productsCount">0</strong>
    </div>

    <div class="card">
      <h3 id="stockLabel">إجمالي المخزون</h3>
      <strong id="stockCount">0</strong>
    </div>

    <div class="card">
      <h3 id="salesLabel">المبيعات</h3>
      <strong id="salesTotal">0</strong>
    </div>

    <div class="card">
      <h3 id="customersLabel">العملاء</h3>
      <strong id="customersCount">0</strong>
    </div>

  </div>

  <div class="section">

    <h2 id="productsTitle">إدارة المنتجات</h2>

    <div class="form">

      <input
        type="text"
        id="productName"
        placeholder="اسم المنتج"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="السعر"
        min="0"
      >

      <input
        type="number"
        id="productQuantity"
        placeholder="الكمية"
        min="0"
      >

      <button class="add-btn" onclick="addProduct()" id="addButton">
        إضافة
      </button>

    </div>

    <div id="message" class="message"></div>

    <table>

      <thead>
        <tr>
          <th
