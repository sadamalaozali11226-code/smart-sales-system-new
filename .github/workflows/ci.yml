name: CI

on:
  pull_request:
    branches:
      - main
      - audit/priority-integrity-*
  push:
    branches:
      - main
      - audit/priority-integrity-*
      - fix/sale-confirmation-ui-*

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_sales_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: smart_sales_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run HTTP and JavaScript smoke tests
        run: npm test

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply supplier payment migration to isolated PostgreSQL fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/supplier-payment-migration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017204900_guard_supplier_payment_balance_after_returns.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/supplier-payment-migration-assertions.sql

      - name: Verify migration fails closed when reapplied
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017204900_guard_supplier_payment_balance_after_returns.sql > /tmp/supplier-migration-reapply.log 2>&1; then
            echo "Migration unexpectedly succeeded when reapplied."
            cat /tmp/supplier-migration-reapply.log
            exit 1
          fi
          grep -q "Expected one supplier balance validation pattern" /tmp/supplier-migration-reapply.log

      - name: Verify narrow TRUNCATE revocation in isolated PostgreSQL fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-privilege-baseline.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-privilege-revoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-privilege-assertions.sql

      - name: Verify existing and default TRUNCATE revocation for both creator roles
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-default-privilege-baseline.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-default-privilege-revoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-default-privilege-assertions.sql

      - name: Test the actual public TRUNCATE migration in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-public-migration-baseline.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019090000_revoke_client_truncate_public.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/truncate-public-migration-assertions.sql

      - name: Test durable sale idempotency in an isolated database
        run: |
          createdb sale_idempotency_test
          psql -d sale_idempotency_test -v ON_ERROR_STOP=1 -f tests/fixtures/sale-idempotency-baseline.sql
          psql -d sale_idempotency_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261021100000_add_sale_idempotency.sql
          psql -d sale_idempotency_test -v ON_ERROR_STOP=1 -f tests/fixtures/sale-idempotency-assertions.sql
